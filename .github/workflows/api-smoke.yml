name: AI API Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-smoke.yml'
      - '.github/codex/api-smoke.mjs'

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check coding and review APIs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CODING_API_BASE_URL: ${{ vars.CODING_API_BASE_URL || secrets.CODING_API_BASE_URL }}
          CODING_API_MODEL: ${{ vars.CODING_API_MODEL || secrets.CODING_API_MODEL }}
          CODING_API_KEY: ${{ secrets.CODING_API_KEY }}
          REVIEW_API_BASE_URL: ${{ vars.REVIEW_API_BASE_URL || secrets.REVIEW_API_BASE_URL }}
          REVIEW_API_MODEL: ${{ vars.REVIEW_API_MODEL || secrets.REVIEW_API_MODEL }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
        run: node .github/codex/api-smoke.mjs
